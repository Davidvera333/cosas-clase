<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionales</title>
</head>

<body>

    <script>
        //declaramos una variable llamada esMayor con el valor true

        let esMayor = true;

        //usamos una estructura condicional para decidir que mensaje mostrar

        if (esMayor) {
            //si esMayor es true , se muestra este mensaje
            alert("Puedes entrar al sitio")
        }
        else
        //si esMayor es false, se muestra este mensaje
        {

            alert("no puedes entrar al sitio")
        }





    </script>

</body>

</html>
