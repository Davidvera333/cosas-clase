<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambios de estilo </title>
</head>

<body>

    <h1 id="titulo">Este estilo se cambiara</h1>
    <button onclick="estilo()">Cambiar estilo</button>

    <script>
        //funcion que cambia el estilo del texto 
        function estilo() {
            let titulo = document.getElementById("titulo");

            //esto formatea algo el texto del  H1

            titulo.style.color = "white";
            titulo.style.fontSize = "30px";
            titulo.style.fontWeight = "bold";
            titulo.style.fontStyle = "italic";
            titulo.style.backgroundColor = "black";
            titulo.style.margin = "auto";
            titulo.style.marginBottom = "20px";
            titulo.style.textAlign = "center";

        }






    </script>








</body>

</html>
