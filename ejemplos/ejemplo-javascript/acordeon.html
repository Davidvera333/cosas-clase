<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<body>


    <!--Esto es un acordeon-->
    <div class="accordion accordion-flush" id="accordionFlushExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                    <p><b>Primer acordeon</b></p>
                </button>
            </h2>
            <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                <div class="accordion-body">
                    <p class="textoacordeon">Placeholder content for this accordion, which is intended to demonstrate
                        the
                        <code>.accordion-flush</code> class. This is the first item's accordion body.
                    </p>
                </div>
            </div>
        </div>

    </div>
    <!--Esto es un carrusel de fotos-->
    <div id="carouselExampleFade" class="carousel slide carousel-fade">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="foto1.PNG" width="300px" height="500px" class="d-block w-100" alt="img1">
            </div>
            <div class="carousel-item">
                <img src="foto2.PNG" width="100px" height="500px" class="d-block w-100" alt="img2">
            </div>
            <div class="carousel-item">
                <img src="foto3.PNG" width="100px" height="500px" class="d-block w-100" alt="img3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <style>
        /*Esto es para modificar el acordeon*/
        body {
            background-color: rgb(199, 196, 196);
        }

        .accordion-body {
            background-color: rgb(199, 196, 196);
        }

        .textoacordeon {
            font-style: italic;
        }

        button {
            background-color: rgb(199, 196, 196) !important;
            border-color: black !important;
            border-width: 1px !important;
            border-style: solid !important;
        }

        /*Para el mensaje de alerta*/
        .alerta {
            font-style: italic;
        }
    </style>


</body>
<footer class="alerta">
    <div class="alert alert-danger" role="alert">
        Mensaje de alerta¡
    </div>
</footer>

</html>
