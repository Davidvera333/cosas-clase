<body>


    <div class="col-12 col-md-6">

        <form action="#" method="post">
            <fieldset>
                <legend><b>Formulario Contacto</b></legend>
                <!--Nombre usuario-->
                <label for="nombre"><b>Nombre:</b></label>
                <input type="text" name="nombre" required placeholder="Su Nombre">
                <!--correo electronico-->

                <label for="email"><b>Correo electronico:</b></label>
                <input type="email" name="email" pattern={@} required placeholder="Correo@gmail">
                <!-- Numero de telefono-->
                <label for="tel"><b>Numero de telefono:</b></label>
                <input type="tel" name="tel" pattern="[0-9]{9}" required placeholder="---------">

            </fieldset>
            <!-- Menu desplegable-->
            <fieldset>
                <label for="select"><b>Servicios:</b></label>

                <select>
                    <option>Asistencia tecnica</option>
                    <option>Preguntas frecuentes</option>
                    <option>Nuestra pagina web</option>
                </select>
            </fieldset>


            <!-- Campo para comentarios-->
            <div>
                <fieldset>

                    <label for="comentarios"><b>Comentarios</b></label>
                    <textarea></textarea>

                </fieldset>
            </div>
            <!--Boton de enviar-->
            <fieldset>
                <input class="enviar" type="submit" name="Enviar" value="Enviar">
                <!--Boton de borrar-->
                <input type="reset" name="borrar" value="borrar">
            </fieldset>
        </form>
        <div class="col-12 col-md-3"></div>
        <!--mapa del sitio-->
        <div class="mapouter">
            <div class="gmap_canvas"><iframe class="gmap_iframe" frameborder="0" scrolling="no" marginheight="0"
                    marginwidth="0"
                    src="https://maps.google.com/maps?width=522&amp;height=245&amp;hl=en&amp;q=anteva&amp;t=&amp;z=15&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe><a
                    href="https://sprunkiplay.com/">Sprunki Game</a></div>
            <style>
                .mapouter {
                    position: relative;
                    text-align: right;
                    width: 522px;
                    height: 245px;
                    padding-top: 15px;
                    padding-left: 15px;


                }

                .gmap_canvas {
                    overflow: hidden;
                    background: none !important;
                    width: 522px;
                    height: 245px;
                }

                .gmap_iframe {
                    width: 522px !important;
                    height: 245px !important;
                }
            </style>
        </div>
        <style>
            .mapouter {
                position: relative;
                text-align: right;
                width: 538px;
                height: 312px;
            }

            .gmap_canvas {
                overflow: hidden;

                width: 538px;

            }

            .gmap_iframe {
                width: 538px !important;
                height: 312px !important;
            }
        </style>
    </div>

    <!--Formateo del html Contacto EN CSS-->
    <style>
        input.enviar {
            background-color: black;
            color: white;
        }

        legend {
            padding-left: 5px;
            background-color: black;
            color: white;
        }

        option {
            font-style: italic;
        }

        input {
            margin-bottom: 10px;
            border-bottom: 0px;
        }

        fieldset {
            background-color: beige;
        }

        ::placeholder,
        label {
            padding-left: 5px;

        }

        /*para el tema del Responsive de las pantallas */
        /* para tlf moviles 576X 1024*/
        @media (min-width: 576px) {
            fieldset {
                display: flex;

            }

        }

        /* tablets o mas grandes*/
        @media (min-width: 768px) {
            fieldset {

            }
        }


        /* XX-Large devices (larger desktops, 1400px and up)*/
        @media (min-width: 1400px) {

                flex-direction: column;

            }
        }
