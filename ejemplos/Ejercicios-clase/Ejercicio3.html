<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <!--BootsTraps para dar formato-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--BootsTraps-->

</head>
<!--Formulario en HTML-->
<form action="#" method="post">
    <fieldset>
        <legend><b>Formulario Contacto</b></legend>
        <!--Nombre usuario-->
        <label for="nombre"><b>Nombre:</b></label>
        <input type="text" name="nombre" required placeholder="Su Nombre">
        <!--correo electronico-->

        <label for="email"><b>Correo electronico:</b></label>
        <input type="email" name="email" pattern={@} required placeholder="Correo@gmail">
        <!-- Numero de telefono-->
        <label for="tel"><b>Numero de telefono:</b></label>
        <input type="tel" name="tel" pattern="[0-9]{9}" required placeholder="---------">

    </fieldset>
    <!-- Menu desplegable-->
    <fieldset>
        <label for="select"><b>Servicios:</b></label>

        <select>
            <option>Asistencia tecnica</option>
            <option>Preguntas frecuentes</option>
            <option>Nuestra pagina web</option>
        </select>
    </fieldset>


    <!-- Campo para comentarios-->
    <div>
        <fieldset>

            <label for="comentarios"><b>Comentarios</b></label>
            <textarea></textarea>

        </fieldset>
    </div>
    <!--Boton de enviar-->
    <fieldset>
        <input class="enviar" type="submit" name="Enviar" value="Enviar">
        <!--Boton de borrar-->
        <input class="borrar" type="reset" name="borrar" value="borrar">
    </fieldset>
</form>
<style>
    /*Formateo del html*/

    input.enviar {
        background-color: black;
        color: white;
    }

    legend {
        padding-left: 5px;
        background-color: black;
        color: white;
    }

    option {
        font-style: italic;
    }

    input {
        margin-bottom: 10px;
        border-bottom: 0cap;
    }

    fieldset {
        background-color: beige;
    }

    ::placeholder,
    label {
        padding-left: 5px;

    }

    /*para el tema del Responsive de las pantallas */
    /* para tlf moviles 576X 1024*/
    @media (min-width: 576px) {
        fieldset {
            display: flex;
            flex-direction: column;
            width: 80%;
            max-width: 100%;
            margin: auto;
        }

    }

    /* tablets o mas grandes*/
    @media (min-width: 768px) {
        fieldset {
            display: flex;
            flex-direction: column;
        }
    }


    /* XX-Large devices (larger desktops, 1400px and up)*/
    @media (min-width: 1400px) {
        fieldset {
            display: flex;
            flex-direction: column;

        }
    }
</style>

</html>
